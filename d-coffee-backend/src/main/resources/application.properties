app.name=d-coffee-backend

# 数据库配置可通过环境变量或部署专用配置文件覆盖。
db.driver=com.mysql.cj.jdbc.Driver
db.url=${DB_URL:jdbc:mysql://localhost:3306/d_coffee_db?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false}
db.username=${DB_USERNAME:root}
db.password=${DB_PASSWORD:123456}

mybatis.mapper-locations=classpath*:mapper/**/*.xml
mybatis.type-aliases-package=com.dcoffee.entity

# 部署前请替换仅用于开发的默认值；JWT 签名密钥至少需要 32 字节。
jwt.secret=${JWT_SECRET:change-me-before-production-dcoffee-jwt-secret}
jwt.expiration-seconds=${JWT_EXPIRATION_SECONDS:7200}

upload.max-size-bytes=5242880
